name: Push Fix CI

on:
  push:
    branches:
      - fix/push-health-self-healing
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-build-lint-unit:
    name: Frontend build, lint, and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vibe/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  frontend-e2e:
    name: Frontend Playwright E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vibe/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            vibe/playwright-report/
            vibe/test-results/
          if-no-files-found: ignore

  backend-build-test:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand

  content-filter:
    name: Content filter build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/content-filter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vibe/package-lock.json
      - run: npm ci --prefix ../../vibe
      - run: npm run build
