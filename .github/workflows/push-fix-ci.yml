name: Push Fix CI

on:
  push:
    branches:
      - fix/push-health-self-healing
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  provider-gift-request-fix:
    name: Apply provider gift request realtime fix
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/provider-gift-request-realtime' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply optimistic gift request implementation
        shell: python
        run: |
          from pathlib import Path

          path = Path('vibe/src/components/AdultZone/ProviderMessages.tsx')
          text = path.read_text()

          old_handler = '''  const handleSendGiftRequest = async () => {
    if (!selectedGift || !selectedConv) return;
    if (isSendingGiftRequest) return;
    setIsSendingGiftRequest(true);
    try {
      const res = await fetch(`${API_BASE_URL}/v1/adult/sext/conversations/${selectedConv.conversationId}/gift-request`, {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({
          giftId: selectedGift._id,
          message: giftRequestNote
        })
      });
      const data = await res.json();
      if (data.id) {
        setMessages(prev => [...prev, data]);
        setShowGiftRequestDialog(false);
        setSelectedGift(null);
        setGiftRequestNote('');
        toast.success(`Requested a ${selectedGift.name}!`);
      }
    } catch (err) {
      toast.error('Failed to request gift');
    } finally {
      setIsSendingGiftRequest(false);
    }
  };
'''

          new_handler = '''  const handleSendGiftRequest = async () => {
    if (!selectedGift || !selectedConv) return;
    if (isSendingGiftRequest) return;

    const conversationId = selectedConv.conversationId;
    const gift = selectedGift;
    const note = giftRequestNote;
    const senderId = user?.id || (user as any)?._id || '';
    const receiverId = selectedConv.otherUser?.id;
    const tempId = `temp_gift_request_${Date.now()}`;

    const optimisticMessage: Message = {
      id: tempId,
      conversationId,
      senderId,
      receiverId,
      content: `Requested a gift: ${gift.name}`,
      mediaType: 'gift_request',
      creditCost: 0,
      isUnlocked: true,
      isOptimistic: true,
      isFailed: false,
      isDeleted: false,
      createdAt: new Date().toISOString(),
      deliveredAt: null,
      readAt: null,
      giftRequest: {
        giftId: gift._id,
        giftName: gift.name,
        giftIconUrl: gift.iconUrl,
        giftValue: gift.creditCost,
        message: note,
        status: 'pending'
      }
    };

    setIsSendingGiftRequest(true);
    setMessages(prev => [...prev, optimisticMessage]);
    setShowGiftRequestDialog(false);
    setSelectedGift(null);
    setGiftRequestNote('');

    try {
      const res = await fetch(`${API_BASE_URL}/v1/adult/sext/conversations/${conversationId}/gift-request`, {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({
          giftId: gift._id,
          message: note
        })
      });
      const data = await res.json();

      if (!res.ok || !data.id) {
        throw new Error(data.error || 'Failed to request gift');
      }

      setMessages(prev => {
        const realMessage = {
          ...data,
          conversationId: data.conversationId || conversationId,
          isOptimistic: false,
          isFailed: false
        };
        const hasRealMessage = prev.some(m => m.id === realMessage.id);
        if (hasRealMessage) {
          return prev.filter(m => m.id !== tempId);
        }
        return prev.map(m => m.id === tempId ? realMessage : m);
      });
      fetchConversations();
      socketRef.current?.emit('sext:message_delivered', { messageId: data.id });
      toast.success(`Requested a ${gift.name}!`);
    } catch (err: any) {
      setMessages(prev => prev.filter(m => m.id !== tempId));

      if (activeConvIdRef.current === conversationId) {
        setSelectedGift(gift);
        setGiftRequestNote(note);
        setShowGiftRequestDialog(true);
      }

      toast.error(err?.message || 'Failed to request gift');
    } finally {
      setIsSendingGiftRequest(false);
    }
  };
'''

          if text.count(old_handler) != 1:
              raise SystemExit('Expected exactly one existing gift request handler')
          text = text.replace(old_handler, new_handler, 1)

          old_socket = """        setMessages(prev => [...prev, payload.message]);
        markConversationRead(selectedConv.conversationId);
        s.emit('sext:message_delivered', { messageId: payload.message.id });"""
          new_socket = """        setMessages(prev => prev.some(m => m.id === payload.message.id)
          ? prev
          : [...prev, payload.message]);
        markConversationRead(selectedConv.conversationId);
        s.emit('sext:message_delivered', { messageId: payload.message.id });"""

          if text.count(old_socket) != 1:
              raise SystemExit('Expected exactly one sext:new_message append site')
          path.write_text(text.replace(old_socket, new_socket, 1))

      - name: Add regression coverage
        shell: python
        run: |
          from pathlib import Path

          path = Path('vibe/src/tests/ProviderMessages.test.tsx')
          text = path.read_text()

          old_handler = '''      http.post('**/v1/adult/sext/conversations/conv-123/gift-request', () => {
        return HttpResponse.json({
          id: 'msg-gift-req-created',
          senderId: 'provider-123',
          receiverId: 'member-456',
          content: 'You requested a Red Rose',
          mediaType: 'gift_request',
          giftRequest: {
            giftId: 'gift-rose',
            giftName: 'Red Rose',
            giftIconUrl: 'rose',
            giftValue: 10,
            message: 'A nice rose!',
            status: 'pending'
          },
          createdAt: new Date().toISOString()
        });
      }),'''

          new_handler = '''      http.post('**/v1/adult/sext/conversations/conv-123/gift-request', async () => {
        await new Promise(resolve => setTimeout(resolve, 500));
        return HttpResponse.json({
          id: 'msg-gift-req-created',
          conversationId: 'conv-123',
          senderId: 'provider-123',
          receiverId: 'member-456',
          content: 'You requested a Red Rose',
          mediaType: 'gift_request',
          giftRequest: {
            giftId: 'gift-rose',
            giftName: 'Red Rose',
            giftIconUrl: 'rose',
            giftValue: 10,
            message: 'A nice rose!',
            status: 'pending'
          },
          createdAt: new Date().toISOString()
        });
      }),'''

          if text.count(old_handler) != 1:
              raise SystemExit('Expected exactly one gift request MSW handler')
          text = text.replace(old_handler, new_handler, 1)

          old_assertion = '''    // Should create a gift request message bubble in feed
    await waitFor(() => {
      expect(screen.getByTestId('gift-request-message')).toBeInTheDocument();
      expect(screen.getByText('You requested a Red Rose')).toBeInTheDocument();
    });'''

          new_assertion = '''    // The card must render before the HTTP request resolves.
    expect(screen.getByTestId('gift-request-message')).toBeInTheDocument();
    expect(screen.getByText('You requested a Red Rose')).toBeInTheDocument();
    expect(screen.getByText('⏳ Waiting for response...')).toBeInTheDocument();
    expect(screen.queryByTestId('gift-request-dialog')).not.toBeInTheDocument();

    // Once the API resolves, the optimistic card is reconciled to the persisted message.
    await waitFor(() => {
      expect(screen.getByTestId('gift-request-message')).toBeInTheDocument();
      expect(screen.getByText('You requested a Red Rose')).toBeInTheDocument();
    });'''

          if text.count(old_assertion) != 1:
              raise SystemExit('Expected exactly one existing gift request assertion')
          path.write_text(text.replace(old_assertion, new_assertion, 1))

      - name: Verify the actual source changes
        working-directory: vibe
        run: |
          git diff --check
          npm test -- --run src/tests/ProviderMessages.test.tsx

      - name: Commit implementation and remove temporary fixer workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- .github/workflows/push-fix-ci.yml
          git rm .github/workflows/one-time-provider-gift-request-fix.yml
          git add vibe/src/components/AdultZone/ProviderMessages.tsx vibe/src/tests/ProviderMessages.test.tsx
          git diff --cached --check
          git commit -m "fix: make provider gift requests optimistic and realtime"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  frontend-build-lint-unit:
    name: Frontend build, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # Regenerate the workspace lockfile until the updated lockfile is committed.
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build --workspace=vibe
      - run: npm run lint --workspace=vibe
      - run: npm test --workspace=vibe

  frontend-e2e:
    name: Frontend Playwright E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: vibe
      - run: npm run test:e2e --workspace=vibe
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            vibe/playwright-report/
            vibe/test-results/
          if-no-files-found: ignore

  backend-build-test:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Backend package.json is ahead of its committed lockfile; regenerate it before npm ci.
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand

  content-filter:
    name: Content filter build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --ignore-scripts
      - run: npm run build --workspace=@yourapp/content-filter
