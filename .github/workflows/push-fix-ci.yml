name: Push Fix CI

on:
  push:
    branches:
      - fix/push-health-self-healing
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-build-lint-unit:
    name: Frontend build, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # Regenerate the workspace lockfile until the updated lockfile is committed.
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build --workspace=vibe
      - run: npm run lint --workspace=vibe
      - run: npm test --workspace=vibe

  frontend-e2e:
    name: Frontend Playwright E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: vibe
      - run: npm run test:e2e --workspace=vibe
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            vibe/playwright-report/
            vibe/test-results/
          if-no-files-found: ignore

  backend-build-test:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Backend package.json is ahead of its committed lockfile; regenerate it before npm ci.
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand

  content-filter:
    name: Content filter build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --ignore-scripts
      - run: npm run build --workspace=@yourapp/content-filter
