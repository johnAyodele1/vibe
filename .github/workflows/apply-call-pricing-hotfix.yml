name: Apply call pricing hotfix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply production-safe call pricing patch
        shell: python
        run: |
          from pathlib import Path

          backend = Path('backend/src/controllers/adultSext.controller.ts')
          frontend = Path('vibe/src/components/AdultZone/AdultCallContext.tsx')

          backend_text = backend.read_text()
          old_backend_rate = """    // Determine cost rate
    const rate = type === 'video'
      ? (receiver.providerProfile?.videoCallPrice ?? receiver.providerProfile?.pricePerMinute ?? 0)
      : (receiver.providerProfile?.audioCallPrice ?? receiver.providerProfile?.pricePerMinute ?? 0);

    const userPrice = getClientPrice(rate);

    if (user.credits < userPrice) {
      return res.status(402).json({ success: false, error: 'Insufficient credits to start call' });
    }
"""
          new_backend_rate = """    // Calls use one authoritative provider-configured rate for both audio and video.
    const rate = receiver.providerProfile?.pricePerMinute;

    if (typeof rate !== 'number' || !Number.isFinite(rate) || rate <= 0) {
      return res.status(400).json({
        success: false,
        error: 'Provider has not configured a valid call rate',
      });
    }

    if (user.credits < rate) {
      return res.status(402).json({
        success: false,
        error: 'Insufficient credits to start call',
        required: rate,
        current: user.credits,
      });
    }
"""
          if old_backend_rate not in backend_text:
              raise SystemExit('Expected backend call-rate block not found')
          backend_text = backend_text.replace(old_backend_rate, new_backend_rate, 1)

          old_socket_rate = """        type,
        webrtcRoomId,
        rate: userPrice
"""
          new_socket_rate = """        type,
        webrtcRoomId,
        rate
"""
          if old_socket_rate not in backend_text:
              raise SystemExit('Expected incoming-call socket rate block not found')
          backend_text = backend_text.replace(old_socket_rate, new_socket_rate, 1)

          old_billing = """    const clientPrice = getClientPrice(call.perMinuteRate);
    const callerUser = await AdultUser.findById(call.callerId).session(dbSession);
"""
          new_billing = """    // The call record already stores the single authoritative provider-configured rate.
    // Do not apply a second pricing transformation here; calculateFees() handles the platform fee.
    const clientPrice = call.perMinuteRate;
    const callerUser = await AdultUser.findById(call.callerId).session(dbSession);
"""
          if old_billing not in backend_text:
              raise SystemExit('Expected call-minute billing block not found')
          backend_text = backend_text.replace(old_billing, new_billing, 1)
          backend.write_text(backend_text)

          frontend_text = frontend.read_text()

          old_transition = """  const transitionToTerminalCall = useCallback((reason: string, durationSeconds = 0) => {
    const currentCall = activeCallRef.current;
    if (!currentCall) {
      resetCallState();
      return;
    }

    let status: 'ended' | 'declined' | 'missed' | 'failed' | 'cancelled' = 'ended';
    if (reason === 'declined') status = 'declined';
    else if (reason === 'missed' || reason === 'no_answer') status = 'missed';
    else if (reason === 'cancelled_by_caller') status = 'cancelled';
    else if (reason === 'connection_failed') status = 'failed';

    let cost = 0;
    if (status === 'ended') {
      const billedMinutes = Math.floor(durationSeconds / 60) + 1;
      cost = currentCall.rate * billedMinutes;
    }

    const summary: CallSummaryInfo = {
"""
          new_transition = """  const transitionToTerminalCall = useCallback((reason: string, durationSeconds = 0, creditsDeducted = 0) => {
    const currentCall = activeCallRef.current;
    if (!currentCall) {
      resetCallState();
      return;
    }

    let status: 'ended' | 'declined' | 'missed' | 'failed' | 'cancelled' = 'ended';
    if (reason === 'declined') status = 'declined';
    else if (reason === 'missed' || reason === 'no_answer') status = 'missed';
    else if (reason === 'cancelled_by_caller') status = 'cancelled';
    else if (reason === 'connection_failed') status = 'failed';

    // Billing is authoritative on the backend. Never derive the final charge from duration on the client.
    const cost = status === 'ended' ? Math.max(0, Number(creditsDeducted) || 0) : 0;

    const summary: CallSummaryInfo = {
"""
          if old_transition not in frontend_text:
              raise SystemExit('Expected frontend terminal-call billing block not found')
          frontend_text = frontend_text.replace(old_transition, new_transition, 1)

          old_initiate = """      if (callData.callId) {
        const rate = overrideRate || callData.perMinuteRate || 5;
        const receiverName = partnerInfo?.displayName || callData.receiver?.displayName || 'Provider';
"""
          new_initiate = """      if (callData.callId) {
        const rate = Number(callData.perMinuteRate);
        if (!Number.isFinite(rate) || rate <= 0) {
          toast.error('Provider has not configured a valid call rate.');
          await endCallOnBackend(callData.callId, 'invalid_call_rate');
          resetCallState();
          return false;
        }

        const receiverName = partnerInfo?.displayName || callData.receiver?.displayName || 'Provider';
"""
          if old_initiate not in frontend_text:
              raise SystemExit('Expected frontend hardcoded pricing fallback not found')
          frontend_text = frontend_text.replace(old_initiate, new_initiate, 1)

          old_end_backend = """  const endCallOnBackend = useCallback(async (callId: string, reason = 'hung_up') => {
    try {
      await fetch(`${API_BASE_URL}/v1/adult/sext/calls/${callId}/end`, {
        method: 'PUT',
        headers: getHeaders(),
        body: JSON.stringify({ reason })
      });
    } catch (err) {
      console.error('[AdultCall] Failed to end call on backend:', err);
    }
  }, [getHeaders]);
"""
          new_end_backend = """  const endCallOnBackend = useCallback(async (callId: string, reason = 'hung_up') => {
    try {
      const response = await fetch(`${API_BASE_URL}/v1/adult/sext/calls/${callId}/end`, {
        method: 'PUT',
        headers: getHeaders(),
        body: JSON.stringify({ reason })
      });

      if (!response.ok) return null;
      return await response.json();
    } catch (err) {
      console.error('[AdultCall] Failed to end call on backend:', err);
      return null;
    }
  }, [getHeaders]);
"""
          if old_end_backend not in frontend_text:
              raise SystemExit('Expected backend-end response block not found')
          frontend_text = frontend_text.replace(old_end_backend, new_end_backend, 1)

          old_end_call = """  const endCall = useCallback(async (reason = 'hung_up', durationSeconds = 0) => {
    const currentCall = activeCallRef.current;
    if (currentCall) {
      await endCallOnBackend(currentCall.callId, reason);
      transitionToTerminalCall(reason, durationSeconds);
    } else {
      resetCallState();
    }
  }, [endCallOnBackend, transitionToTerminalCall, resetCallState]);
"""
          new_end_call = """  const endCall = useCallback(async (reason = 'hung_up', durationSeconds = 0) => {
    const currentCall = activeCallRef.current;
    if (currentCall) {
      const result = await endCallOnBackend(currentCall.callId, reason);
      transitionToTerminalCall(reason, durationSeconds, result?.creditsDeducted ?? 0);
    } else {
      resetCallState();
    }
  }, [endCallOnBackend, transitionToTerminalCall, resetCallState]);
"""
          if old_end_call not in frontend_text:
              raise SystemExit('Expected frontend end-call block not found')
          frontend_text = frontend_text.replace(old_end_call, new_end_call, 1)

          old_socket_end = """    socket.on('call:ended', (payload: { callId: string; reason?: string; durationSeconds?: number }) => {
      const currentCall = activeCallRef.current;
      if (currentCall && currentCall.callId === payload.callId) {
        transitionToTerminalCall(payload.reason || 'hung_up', payload.durationSeconds || 0);
      }
    });
"""
          new_socket_end = """    socket.on('call:ended', (payload: { callId: string; reason?: string; durationSeconds?: number; creditsDeducted?: number }) => {
      const currentCall = activeCallRef.current;
      if (currentCall && currentCall.callId === payload.callId) {
        transitionToTerminalCall(
          payload.reason || 'hung_up',
          payload.durationSeconds || 0,
          payload.creditsDeducted || 0
        );
      }
    });
"""
          if old_socket_end not in frontend_text:
              raise SystemExit('Expected frontend socket-end block not found')
          frontend_text = frontend_text.replace(old_socket_end, new_socket_end, 1)

          old_poll_end = """        } else if (data.status === 'declined' || data.status === 'missed' || data.status === 'ended' || data.status === 'failed') {
          transitionToTerminalCall(data.endReason || data.status, data.durationSeconds || 0);
        }
"""
          new_poll_end = """        } else if (data.status === 'declined' || data.status === 'missed' || data.status === 'ended' || data.status === 'failed') {
          transitionToTerminalCall(
            data.endReason || data.status,
            data.durationSeconds || 0,
            data.creditsDeducted || 0
          );
        }
"""
          if old_poll_end not in frontend_text:
              raise SystemExit('Expected frontend reconciliation block not found')
          frontend_text = frontend_text.replace(old_poll_end, new_poll_end, 1)

          frontend.write_text(frontend_text)
          print('Call pricing hotfix applied successfully')

      - name: Backend typecheck/build
        run: |
          npm ci
          npm run build
        working-directory: backend

      - name: Frontend typecheck/build
        run: |
          npm ci
          npm run build
        working-directory: vibe

      - name: Commit hotfix and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-call-pricing-hotfix.yml HOTFIX_TRIGGER.md
          git add backend/src/controllers/adultSext.controller.ts vibe/src/components/AdultZone/AdultCallContext.tsx .github/workflows/apply-call-pricing-hotfix.yml HOTFIX_TRIGGER.md
          git commit -m "fix: unify audio and video call pricing" || exit 0
          git push origin HEAD:${{ github.head_ref }}
