name: Fix Sext Realtime Cards

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-realtime-contract:
    if: github.event.head_commit.message != 'fix: realtime sext special-message payloads'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch realtime special-message payloads
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/src/controllers/adultSext.controller.ts')
          text = path.read_text()

          replacements = [
              (
                  """    const responsePayload = {\n      id: msg._id,\n      senderId: msg.senderId,""",
                  """    const responsePayload = {\n      id: msg._id,\n      conversationId: msg.conversationId,\n      senderId: msg.senderId,""",
              ),
              (
                  """        message: {\n          id: msg._id,\n          senderId: msg.senderId,""",
                  """        message: {\n          id: msg._id,\n          conversationId: msg.conversationId,\n          senderId: msg.senderId,""",
              ),
              (
                  """        message: {\n          id: imageMsg._id,\n          senderId: imageMsg.senderId,""",
                  """        message: {\n          id: imageMsg._id,\n          conversationId: requestMsg.conversationId,\n          senderId: imageMsg.senderId,""",
              ),
              (
                  """        message: {\n          id: invoiceMsg._id,\n          senderId: invoiceMsg.senderId,""",
                  """        message: {\n          id: invoiceMsg._id,\n          conversationId: requestMsg.conversationId,\n          senderId: invoiceMsg.senderId,""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Verify special-message realtime contract
        run: |
          grep -n -A8 -B2 "const responsePayload =" backend/src/controllers/adultSext.controller.ts | grep -q "conversationId: msg.conversationId"
          grep -n -A8 "message: {" backend/src/controllers/adultSext.controller.ts | grep -q "conversationId: msg.conversationId"
          grep -n -A8 "message: {" backend/src/controllers/adultSext.controller.ts | grep -q "conversationId: requestMsg.conversationId"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts

      - name: Install backend packages
        working-directory: backend
        run: npm ci

      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/controllers/adultSext.controller.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: realtime sext special-message payloads"
          git push
