name: Terminal billing bootstrap

on:
  pull_request_target:
    types: [synchronize, opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'fix/call-pricing-server-authoritative-20260822-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch terminal billing reconciliation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('vibe/src/components/AdultZone/AdultCallContext.tsx')
          text = path.read_text()
          changed = False

          old = """  const transitionToTerminalCall = useCallback((reason: string, durationSeconds = 0, creditsDeducted = 0) => {"""
          new = """  const transitionToTerminalCall = useCallback((reason: string, durationSeconds = 0, creditsDeducted?: number) => {"""
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          old = """    const serverChargedCredits = Number.isFinite(creditsDeducted) && creditsDeducted >= 0\n      ? creditsDeducted\n      : 0;\n\n    const summary: CallSummaryInfo = {"""
          new = """    if (status === 'ended' && (typeof creditsDeducted !== 'number' || !Number.isFinite(creditsDeducted) || creditsDeducted < 0)) {\n      console.error('[AdultCall] Refusing to finalize ended call without server billing data:', {\n        callId: currentCall.callId,\n        reason,\n        creditsDeducted,\n      });\n      return;\n    }\n\n    const serverChargedCredits = status === 'ended' ? creditsDeducted : 0;\n\n    const summary: CallSummaryInfo = {"""
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          marker = """  }, [resetCallState]);\n\n  // Initiate a call"""
          helper = """  }, [resetCallState]);\n\n  const reconcileTerminalCall = useCallback(async (\n    callId: string,\n    fallbackReason = 'hung_up',\n    fallbackDurationSeconds = 0\n  ): Promise<boolean> => {\n    try {\n      const res = await fetch(`${API_BASE_URL}/v1/adult/sext/calls/${callId}`, {\n        headers: getHeaders(),\n      });\n      if (!res.ok) return false;\n\n      const data = await res.json();\n      if (!data.success) return false;\n\n      const status = data.status as string;\n      if (status === 'declined' || status === 'missed' || status === 'failed') {\n        transitionToTerminalCall(\n          data.endReason || status,\n          typeof data.durationSeconds === 'number' ? data.durationSeconds : fallbackDurationSeconds,\n          0\n        );\n        return true;\n      }\n\n      if (status !== 'ended') return false;\n\n      if (typeof data.creditsDeducted !== 'number' || !Number.isFinite(data.creditsDeducted) || data.creditsDeducted < 0) {\n        console.warn('[AdultCall] Terminal status is ended but server billing data is not available yet:', {\n          callId,\n          status,\n          creditsDeducted: data.creditsDeducted,\n        });\n        return false;\n      }\n\n      transitionToTerminalCall(\n        data.endReason || fallbackReason,\n        typeof data.durationSeconds === 'number' ? data.durationSeconds : fallbackDurationSeconds,\n        data.creditsDeducted\n      );\n      return true;\n    } catch (err) {\n      console.warn('[AdultCall] Terminal call reconciliation failed:', err);\n      return false;\n    }\n  }, [getHeaders, transitionToTerminalCall]);\n\n  // Initiate a call"""
          if marker in text and 'const reconcileTerminalCall = useCallback' not in text:
              text = text.replace(marker, helper, 1)
              changed = True

          old = """  // End active call\n  const endCall = useCallback(async (reason = 'hung_up', durationSeconds = 0) => {\n    const currentCall = activeCallRef.current;\n    if (currentCall) {\n      const result = await endCallOnBackend(currentCall.callId, reason);\n      transitionToTerminalCall(\n        reason,\n        result.durationSeconds ?? durationSeconds,\n        result.creditsDeducted ?? 0\n      );\n    } else {\n      resetCallState();\n    }\n  }, [endCallOnBackend, transitionToTerminalCall, resetCallState]);"""
          new = """  // End active call\n  const endCall = useCallback(async (reason = 'hung_up', durationSeconds = 0) => {\n    const currentCall = activeCallRef.current;\n    if (!currentCall) {\n      resetCallState();\n      return;\n    }\n\n    setCallState('ending');\n    setZegoToken(null);\n    setZegoAppId(null);\n    setZegoRoomId(null);\n\n    const isNonBilledReason = reason === 'declined' || reason === 'missed' || reason === 'no_answer' || reason === 'cancelled_by_caller' || reason === 'connection_failed';\n    const result = await endCallOnBackend(currentCall.callId, reason);\n\n    if (isNonBilledReason) {\n      transitionToTerminalCall(reason, result.durationSeconds ?? durationSeconds, 0);\n      return;\n    }\n\n    if (typeof result.creditsDeducted === 'number' && Number.isFinite(result.creditsDeducted) && result.creditsDeducted >= 0) {\n      transitionToTerminalCall(\n        reason,\n        result.durationSeconds ?? durationSeconds,\n        result.creditsDeducted\n      );\n      return;\n    }\n\n    const reconciled = await reconcileTerminalCall(\n      currentCall.callId,\n      reason,\n      result.durationSeconds ?? durationSeconds\n    );\n\n    if (!reconciled) {\n      toast.error('Call ended. We are confirming the final billing with the server.');\n    }\n  }, [endCallOnBackend, reconcileTerminalCall, transitionToTerminalCall, resetCallState]);"""
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          old = """    socket.on('call:ended', (payload: { callId: string; reason?: string; durationSeconds?: number; creditsDeducted?: number }) => {\n      const currentCall = activeCallRef.current;\n      if (currentCall && currentCall.callId === payload.callId) {\n        transitionToTerminalCall(\n          payload.reason || 'hung_up',\n          payload.durationSeconds || 0,\n          typeof payload.creditsDeducted === 'number' ? payload.creditsDeducted : 0\n        );\n      }\n    });"""
          new = """    socket.on('call:ended', async (payload: { callId: string; reason?: string; durationSeconds?: number; creditsDeducted?: number }) => {\n      const currentCall = activeCallRef.current;\n      if (!currentCall || currentCall.callId !== payload.callId) return;\n\n      setCallState('ending');\n      setZegoToken(null);\n      setZegoAppId(null);\n      setZegoRoomId(null);\n\n      const reason = payload.reason || 'hung_up';\n      const isNonBilledReason = reason === 'declined' || reason === 'missed' || reason === 'no_answer' || reason === 'cancelled_by_caller' || reason === 'connection_failed';\n\n      if (isNonBilledReason) {\n        transitionToTerminalCall(reason, payload.durationSeconds ?? 0, 0);\n        return;\n      }\n\n      if (typeof payload.creditsDeducted === 'number' && Number.isFinite(payload.creditsDeducted) && payload.creditsDeducted >= 0) {\n        transitionToTerminalCall(reason, payload.durationSeconds ?? 0, payload.creditsDeducted);\n        return;\n      }\n\n      await reconcileTerminalCall(currentCall.callId, reason, payload.durationSeconds ?? 0);\n    });"""
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          old = """  // Status Reconciliation Polling while in 'calling' or 'incoming'\n  useEffect(() => {\n    if (callState !== 'calling' && callState !== 'incoming') return;"""
          new = """  // Status Reconciliation Polling while establishing or finalizing a call.\n  useEffect(() => {\n    if (callState !== 'calling' && callState !== 'incoming' && callState !== 'ending') return;"""
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          old = """        } else if (data.status === 'declined' || data.status === 'missed' || data.status === 'ended' || data.status === 'failed') {\n          transitionToTerminalCall(\n            data.endReason || data.status,\n            data.durationSeconds || 0,\n            typeof data.creditsDeducted === 'number' ? data.creditsDeducted : 0\n          );\n        }"""
          new = """        } else if (data.status === 'declined' || data.status === 'missed' || data.status === 'failed') {\n          transitionToTerminalCall(\n            data.endReason || data.status,\n            typeof data.durationSeconds === 'number' ? data.durationSeconds : 0,\n            0\n          );\n        } else if (data.status === 'ended' && typeof data.creditsDeducted === 'number' && Number.isFinite(data.creditsDeducted) && data.creditsDeducted >= 0) {\n          transitionToTerminalCall(\n            data.endReason || data.status,\n            typeof data.durationSeconds === 'number' ? data.durationSeconds : 0,\n            data.creditsDeducted\n          );\n        } else if (data.status === 'ended') {\n          console.warn('[AdultCall] Reconciliation received ended call without creditsDeducted; keeping finalization pending.');\n        }"""
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          marker = """      {/* 5. Restored Previous Call Ending Summary Modal */}"""
          overlay = """      {/* 5. Server-authoritative call finalization */}\n      {callState === 'ending' && activeCall && (\n        <div\n          style={{ paddingTop: 'calc(24px + env(safe-area-inset-top, 0px))' }}\n          className=\"fixed inset-0 bg-black/95 backdrop-blur-lg z-[13000] flex flex-col items-center justify-center p-6 text-white text-center\"\n          data-testid=\"global-ending-call-modal\"\n        >\n          <div className=\"w-12 h-12 rounded-full border-4 border-pink-500 border-t-transparent animate-spin mb-4\" />\n          <h2 className=\"text-xl font-serif italic text-pink-300 mb-2\">Finalizing call...</h2>\n          <p className=\"text-xs text-gray-400 max-w-xs\">Confirming the final server billing before showing the call summary.</p>\n        </div>\n      )}\n\n      {/* 6. Restored Previous Call Ending Summary Modal */}"""
          if marker in text and 'data-testid="global-ending-call-modal"' not in text:
              text = text.replace(marker, overlay, 1)
              changed = True

          if changed:
              path.write_text(text)
          PY
      - name: Add regression test
        shell: bash
        run: |
          if [ ! -f vibe/src/components/AdultZone/callTerminalBilling.test.ts ]; then
            cat > vibe/src/components/AdultZone/callTerminalBilling.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';

          const hasAuthoritativeCharge = (value: unknown): value is number =>
            typeof value === 'number' && Number.isFinite(value) && value >= 0;

          const isNonBilledTerminalReason = (reason: string): boolean =>
            reason === 'declined' || reason === 'missed' || reason === 'no_answer' ||
            reason === 'cancelled_by_caller' || reason === 'connection_failed';

          describe('terminal call billing invariants', () => {
            it('rejects missing billing data for an ended call', () => {
              expect(hasAuthoritativeCharge(undefined)).toBe(false);
              expect(hasAuthoritativeCharge(null)).toBe(false);
              expect(hasAuthoritativeCharge(NaN)).toBe(false);
              expect(hasAuthoritativeCharge(-1)).toBe(false);
            });

            it('accepts server-provided zero only when explicitly present', () => {
              expect(hasAuthoritativeCharge(0)).toBe(true);
              expect(hasAuthoritativeCharge(42)).toBe(true);
            });

            it('allows zero for explicitly non-billed terminal reasons', () => {
              expect(isNonBilledTerminalReason('declined')).toBe(true);
              expect(isNonBilledTerminalReason('missed')).toBe(true);
              expect(isNonBilledTerminalReason('cancelled_by_caller')).toBe(true);
              expect(isNonBilledTerminalReason('connection_failed')).toBe(true);
              expect(isNonBilledTerminalReason('hung_up')).toBe(false);
            });
          });
          EOF
          fi
      - name: Commit fix to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vibe/src/components/AdultZone/AdultCallContext.tsx vibe/src/components/AdultZone/callTerminalBilling.test.ts
          if git diff --cached --quiet; then
            echo 'Terminal billing fix already applied.'
            exit 0
          fi
          git commit -m "fix: reconcile missing terminal call billing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
