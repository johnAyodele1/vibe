<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f42559" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon.png" />
    <title>Vibe - Dating App</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Lora:ital,wght@0,400..700;1,400..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <style>
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      :root {
        --primary: #f42559;
        --background-dark: #221014;
      }

      html,
      body,
      #root {
        min-height: 100%;
        min-height: 100dvh;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
      }

      /*
       * Mobile viewport contract.
       *
       * The application uses viewport-fit=cover, so fixed UI must explicitly
       * account for device/system safe areas. Keep the navigation's visual
       * height fixed and let the safe-area region occupy the extra space.
       * This avoids changing the content box every time mobile browser chrome
       * expands/collapses.
       */
      @media (max-width: 767px) {
        [data-testid="bottom-tab-bar"] {
          box-sizing: border-box !important;
          position: fixed !important;
          left: 0 !important;
          right: 0 !important;
          bottom: 0 !important;
          width: 100% !important;
          height: calc(56px + env(safe-area-max-inset-bottom, env(safe-area-inset-bottom, 0px))) !important;
          min-height: calc(56px + env(safe-area-max-inset-bottom, env(safe-area-inset-bottom, 0px))) !important;
          padding: 0 max(env(safe-area-inset-right, 0px), 0px) env(safe-area-max-inset-bottom, env(safe-area-inset-bottom, 0px)) max(env(safe-area-inset-left, 0px), 0px) !important;
          transform: none !important;
        }

        [data-testid="bottom-tab-bar"] > div {
          box-sizing: border-box !important;
          height: 56px !important;
          min-height: 56px !important;
        }

        /*
         * The Adult Zone root already contains the fixed bottom navigation.
         * Its old root safe-area padding duplicated that inset and made the
         * whole page appear to jump on some iPhones/Android devices.
         */
        #root > div.az-grain {
          padding-bottom: 0 !important;
        }

        /* Private Sext and Provider Messages own the conversation header.
         * Hide the Adult Zone global header synchronously when that header is
         * actually mounted, eliminating the effect-driven one-frame flash.
         */
        @supports selector(body:has(.conversation-header)) {
          body:has(.chat-page-mobile .conversation-header) [data-testid="global-header"] {
            display: none !important;
          }
        }

        /* A conversation fills the mobile viewport; do not reserve another
         * navigation/header-sized strip inside the chat itself. */
        .chat-page-mobile {
          height: 100dvh !important;
          min-height: 100dvh !important;
          max-height: 100dvh !important;
          padding-top: 0 !important;
          padding-bottom: 0 !important;
        }

        .chat-page-mobile .conversation-header {
          box-sizing: border-box !important;
          flex: 0 0 auto !important;
          height: calc(56px + env(safe-area-inset-top, 0px)) !important;
          min-height: calc(56px + env(safe-area-inset-top, 0px)) !important;
          max-height: calc(56px + env(safe-area-inset-top, 0px)) !important;
          padding-top: env(safe-area-inset-top, 0px) !important;
          padding-bottom: 0 !important;
          padding-left: max(4px, env(safe-area-inset-left, 0px)) !important;
          padding-right: max(12px, env(safe-area-inset-right, 0px)) !important;
        }

        .chat-page-mobile .conversation-header__info {
          min-width: 0 !important;
        }

        .chat-page-mobile .conversation-header__actions {
          min-width: 0 !important;
          flex-shrink: 0 !important;
        }

        .chat-page-mobile .conversation-header__credits {
          min-width: 0 !important;
          max-width: 34vw !important;
          overflow: hidden !important;
          text-overflow: ellipsis !important;
          white-space: nowrap !important;
        }
      }

      @media (orientation: landscape) and (max-width: 900px) {
        [data-testid="bottom-tab-bar"] {
          padding-left: max(8px, env(safe-area-inset-left, 0px)) !important;
          padding-right: max(8px, env(safe-area-inset-right, 0px)) !important;
        }
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-white relative"
  >
    <div id="root">
      <!-- Initial beautiful loader animation while JS loads -->
      <div style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #221014;
        z-index: 99999;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      ">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1.5rem;">
          <div style="
            width: 50px;
            height: 50px;
            border: 4px solid rgba(244, 37, 89, 0.1);
            border-left-color: #f42559;
            border-radius: 50%;
            animation: spin 1s linear infinite;
          "></div>
          <h1 style="
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 0.2em;
            color: #f42559;
            margin: 0;
          ">VIBE</h1>
        </div>
      </div>
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
