    <meta name="theme-color" content="#f42559" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    />
    <link

      rel="stylesheet"
    />
    <link

      href="https://cdn.jsdelivr.net/gh/philfung/add-to-homescreen@3.5/dist/add-to-homescreen.min.css"

        <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#f42559",
              "background-light": "#f8f5f6",
              "background-dark": "#221014",
              "surface-dark": "#2f151b",
            },
            fontFamily: {
              display: ["Plus Jakarta Sans", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
          },
        },
      };

    <style>

      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      :root {
        --primary: #f42559;
        --background-dark: #221014;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>

  <body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-white relative"
