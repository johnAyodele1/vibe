<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zippo — Offline</title>
  <style>
    body {
      background: #0a0608;
      color: #f5edf0;
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 24px; font-style: italic; margin-bottom: 12px; color: #ff3366; }
    p  { color: #a08898; font-size: 15px; margin-bottom: 32px; }
    button {
      padding: 14px 32px;
      background: #ff3366;
      border: none;
      border-radius: 100px;
      color: white;
      font: 700 15px 'DM Sans', sans-serif;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
      transition: all 0.2s ease;
    }
    button:hover {
      background: #ff5588;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>You're offline</h1>
  <p>Check your internet connection and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
