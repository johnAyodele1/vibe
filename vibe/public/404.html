<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zippo — Page Not Found</title>
  <style>
    body {
      background: #0a0608;
      color: #f5edf0;
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 28px; font-style: italic; margin-bottom: 12px; color: #ff3366; }
    p { color: #a08898; font-size: 15px; margin-bottom: 32px; }
    a {
      padding: 14px 32px;
      background: #ff3366;
      border: none;
      border-radius: 100px;
      color: white;
      text-decoration: none;
      font: 700 15px 'DM Sans', sans-serif;
      box-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
      transition: all 0.2s ease;
    }
    a:hover {
      background: #ff5588;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>404 — Page Not Found</h1>
  <p>The page or asset you are looking for does not exist or has been moved.</p>
  <a href="/">Return Home</a>
</body>
</html>
